<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#111827">
    <meta name="description"
          content="Learn Emirati Gulf Arabic through everyday conversations and audio.">

    <title>Emirati Arabic — Dialogue Practice</title>

    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>

<body>
    <header class="header">
        <div class="brand">
            <div class="brand-icon">ع</div>

            <div>
                <h1>Emirati Arabic</h1>
                <p>Listen. Understand. Speak.</p>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="welcome">
            <p class="eyebrow">YOUR LEARNING JOURNEY</p>
            <h2>Learn through real conversations.</h2>
            <p class="welcome-text">
                Listen to Emirati Arabic, follow each conversation,
                and learn at your own pace.
            </p>
        </section>

        <nav class="level-tabs" aria-label="Lesson difficulty">
            <button class="level-tab active" data-level="beginner">
                Beginner
                <span>1–5</span>
            </button>

            <button class="level-tab" data-level="everyday">
                Everyday
                <span>6–12</span>
            </button>

            <button class="level-tab" data-level="advanced">
                Advanced
                <span>13–20</span>
            </button>
        </nav>

        <section class="lesson-layout">
            <aside class="lesson-sidebar">
                <h3>Lessons</h3>
                <div id="lesson-list" class="lesson-list">
                    <p class="muted">Loading lessons...</p>
                </div>
            </aside>

            <section class="lesson-content">
                <div id="lesson-details">
                    <p class="muted">Loading your lesson...</p>
                </div>
            </section>
        </section>
    </main>

    <footer class="footer">
        <p>Emirati Arabic Learning · Dialogue Practice</p>
    </footer>

    <div id="status-message"
         class="status-message"
         role="status"
         aria-live="polite"></div>
</body>
</html>
